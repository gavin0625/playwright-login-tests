[pytest]
markers =
    smoke: 冒烟测试
    regression: 回归测试
    login: 登录相关测试

# 命令行选项
addopts =
    -v
    --base-url=https://alliance-lms.dev.i2hk.net/

# 测试文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = .

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
